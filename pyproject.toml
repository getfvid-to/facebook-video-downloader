[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fb-video-downloader"
version = "1.2.0"
description = "Fast, lightweight Python CLI & library to extract and download Facebook videos and reels in HD/SD."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Open Source Community", email = "dev@getfvid.to" }
]
keywords = [
    "facebook-downloader",
    "facebook-video-downloader",
    "fb-downloader",
    "reels-downloader",
    "video-downloader",
    "fb-dl"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
]

[project.scripts]
fb-dl = "fb_downloader.cli:main"

[project.urls]
"Homepage" = "https://getfvid.to"
"Web Alternative" = "https://getfvid.to"
"Source" = "https://github.com/getfvid/facebook-video-downloader"
"Issue Tracker" = "https://github.com/getfvid/facebook-video-downloader/issues"
